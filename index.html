<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV</title>
    <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="wrapper">
      <!--header-->
      <header class="header">
        <div class="container">
          <nav class="nav">
            <div class="nav__container content-bg">
              <ul class="nav__list">
                <li class="nav__item">
                  <a href="#contacts" class="nav__link">Contacts</a>
                </li>
                <li class="nav__item">
                  <a href="#skills" class="nav__link">Skills</a>
                </li>
                <li class="nav__item">
                  <a href="#languages" class="nav__link">Languages</a>
                </li>
                <li class="nav__item">
                  <a href="#summary" class="nav__link">Summary</a>
                </li>
                <li class="nav__item">
                  <a href="#education" class="nav__link">Education</a>
                </li>
                <li class="nav__item">
                  <a href="#courses" class="nav__link">Courses</a>
                </li>
                <li class="nav__item">
                  <a href="#code" class="nav__link">Code</a>
                </li>
                <li class="nav__item">
                  <a href="#projects" class="nav__link">Projects</a>
                </li>
              </ul>
            </div>
          </nav>
        </div>
      </header>
      <!--main-->
      <main class="content">
        <div class="container">
          <div class="content__row">
            <div class="resume-left content-bg">
              <div class="resume-left__body">
                <div class="resume-left__column">
                  <!--profile section-->
                  <section class="profile">
                    <div class="profile__container">
                      <div class="profile__image">
                        <img src="assets/img/avatar.jpg" alt="avatar" />
                      </div>
                      <div class="profile__body">
                        <h1 class="profile__title">Korp <span>Nikita</span></h1>
                        <h3 class="profile__profession">Web developer</h3>
                      </div>
                    </div>
                  </section>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
